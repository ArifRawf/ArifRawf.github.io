<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Single Video Focus</title>
<style>
  :root {
    --bg: #0b0c0f;
    --text: #e6e7eb;
    --muted: #8a93a3;
    --accent: #6ee7ff;
  }
    * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(1200px 800px at 70% -10%, #1a2233 0%, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    padding: 24px;
  }

  header {
    max-width: 900px;
    margin: 0 auto 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    background: rgba(11,12,15,0.7);
    backdrop-filter: blur(10px);
    padding: 12px 0;
    z-index: 10;
  }

  h1 { font-size: clamp(1.4rem, 3vw, 2rem); }
  .badge {
    background: rgba(110, 231, 255, 0.1);
    border: 1px solid rgba(110, 231, 255, 0.3);
    color: var(--accent);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.85rem;
  }

  .grid {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 40px; /* big gap so only 1 is centered */
  }

  .card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    overflow: hidden;
    min-height: 80vh; /* force scroll so only 1 is centered */
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: border-color 0.3s ease, transform 0.3s ease;
  }

  .card.active {
    border-color: var(--accent);
    transform: scale(1.02);
  }

  video {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    background: #000;
  }

  .meta {
    padding: 16px;
    display: flex;
    justify-content: space-between;
    font-size: 0.95rem;
    color: var(--muted);
  }

  .loader { text-align: center; padding: 60px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>Focus Player</h1>
    <span class="badge" id="count">Loading...</span>
  </header>

  <main class="grid" id="videoGrid">
    <div class="loader">Scanning for /1.mp4, /2.mp4...</div>
  </main>

<script>
  const grid = document.getElementById('videoGrid');
  const countBadge = document.getElementById('count');
  let videoIndex = 1;
  let loadedCount = 0;
  const maxVideos = 100;
  let currentActive = null;

  async function videoExists(url) {
    try {
      const res = await fetch(url, { method: 'HEAD' });
      return res.ok;
    } catch { return false; }
  }

  function createVideoCard(src, index) {
    const card = document.createElement('div');
    card.className = 'card';
    
    const video = document.createElement('video');
    video.dataset.src = src;
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.preload = 'none';
    
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `<span>Video #${index}</span><span>Click to unmute</span>`;
    
    card.appendChild(video);
    card.appendChild(meta);
    return {card, video};
  }

  // Only trigger when video is ~50% in center of screen
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const card = entry.target;
      const video = card.querySelector('video');
      
      if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
        // This is the middle one
        if (currentActive && currentActive !== video) {
          currentActive.pause();
          currentActive.src = ''; // unload previous to free memory
          currentActive.closest('.card').classList.remove('active');
        }
        
        if (!video.src) video.src = video.dataset.src; // load only this one
        video.play().catch(()=>{});
        card.classList.add('active');
        currentActive = video;
        
      } else {
        // not in center anymore
        if (video.src) {
          video.pause();
          video.src = ''; // unload it
        }
        card.classList.remove('active');
      }
    });
  }, { threshold: 0.5 }); // 50% of card must be visible

  async function loadVideos() {
    grid.innerHTML = '';
    while (videoIndex <= maxVideos) {
      const url = `/${videoIndex}.mp4`;
      const exists = await videoExists(url);
      if (exists) {
        const {card, video} = createVideoCard(url, videoIndex);
        grid.appendChild(card);
        observer.observe(card); // observe the card, not just video
        loadedCount++;
      } else {
        if (loadedCount === 0) {
          grid.innerHTML = `<div class="loader">No videos found. Add /1.mp4, /2.mp4 to this folder.</div>`;
        }
        break;
      }
      videoIndex++;
    }
    countBadge.textContent = `${loadedCount} video${loadedCount !== 1 ? 's' : ''}`;
  }

  loadVideos();

  // click to unmute
  document.addEventListener('click', (e) => {
    if (e.target.tagName === 'VIDEO') {
      e.target.muted = !e.target.muted;
    }
  });
</script>
</body>
</html>
