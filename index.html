<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Loop Gallery</title>
<style>
  :root {
    --bg: #0b0c0f;
    --card: #12151a;
    --text: #e6e7eb;
    --muted: #8a93a3;
    --accent: #6ee7ff;
  }
    * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(1200px 800px at 70% -10%, #1a2233 0%, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    min-height: 100vh;
    padding: 24px;
  }

  header {
    max-width: 1200px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  h1 { font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 700; }
  .badge {
    background: rgba(110, 231, 255, 0.1);
    border: 1px solid rgba(110, 231, 255, 0.3);
    color: var(--accent);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.85rem;
  }

  .grid {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: transform 0.25s ease;
  }
  .card:hover { transform: translateY(-4px); }

  video {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
    background: #000;
  }

  .meta {
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    color: var(--muted);
  }

  .loader { text-align: center; padding: 40px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>Video Loop</h1>
    <span class="badge" id="count">Loading...</span>
  </header>

  <main class="grid" id="videoGrid">
    <div class="loader">Scanning for videos: /1.mp4, /2.mp4...</div>
  </main>

<script>
  const grid = document.getElementById('videoGrid');
  const countBadge = document.getElementById('count');
  let videoIndex = 1;
  let loadedCount = 0;
  const maxVideos = 100;

  async function videoExists(url) {
    try {
      const res = await fetch(url, { method: 'HEAD' });
      return res.ok;
    } catch { return false; }
  }

  function createVideoCard(src, index) {
    const card = document.createElement('div');
    card.className = 'card';
    
    const video = document.createElement('video');
    video.dataset.src = src; // don't load yet
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.preload = 'none'; // key: don't preload
    video.poster = ''; // optional: add /1.jpg etc
    
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `<span>Video #${index}</span><span>${src}</span>`;
    
    card.appendChild(video);
    card.appendChild(meta);
    return {card, video};
  }

  // IntersectionObserver: only load + play when visible
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target;
      if (entry.isIntersecting) {
        if (!video.src) video.src = video.dataset.src; // load now
        video.play().catch(()=>{}); // autoplay
      } else {
        video.pause(); // pause when off screen to save resources
      }
    });
  }, { rootMargin: '200px', threshold: 0.25 }); // load a bit before it enters view

  async function loadVideos() {
    grid.innerHTML = '';
    while (videoIndex <= maxVideos) {
      const url = `/${videoIndex}.mp4`;
      const exists = await videoExists(url);
      if (exists) {
        const {card, video} = createVideoCard(url, videoIndex);
        grid.appendChild(card);
        observer.observe(video); // watch this video
        loadedCount++;
      } else {
        if (loadedCount === 0) {
          grid.innerHTML = `<div class="loader">No videos found. Add /1.mp4, /2.mp4 to this folder.</div>`;
        }
        break;
      }
      videoIndex++;
    }
    countBadge.textContent = `${loadedCount} video${loadedCount !== 1 ? 's' : ''} loaded`;
  }

  loadVideos();

  // click to unmute
  document.addEventListener('click', (e) => {
    if (e.target.tagName === 'VIDEO') {
      e.target.muted = !e.target.muted;
    }
  });
</script>
</body>
</html>
